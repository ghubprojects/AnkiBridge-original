services:
  compose-dashboard:
    image: "mcr.microsoft.com/dotnet/nightly/aspire-dashboard:latest"
    ports:
      - "18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - "aspire"
    restart: "always"
  postgres:
    image: "docker.io/library/postgres:latest"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    expose:
      - "5432"
    networks:
      - "aspire"
  azurite:
    image: "mcr.microsoft.com/azure-storage/azurite:latest"
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --loose"
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - "azurite-data:/data"
    networks:
      - "aspire"
  migrationservice:
    image: "${MIGRATIONSERVICE_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ConnectionStrings__ankibridgedb: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=ankibridgedb"
      ANKIBRIDGEDB_HOST: "postgres"
      ANKIBRIDGEDB_PORT: "5432"
      ANKIBRIDGEDB_USERNAME: "postgres"
      ANKIBRIDGEDB_PASSWORD: "${POSTGRES_PASSWORD}"
      ANKIBRIDGEDB_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/ankibridgedb"
      ANKIBRIDGEDB_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/ankibridgedb"
      ANKIBRIDGEDB_DATABASENAME: "ankibridgedb"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://compose-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "migrationservice"
    depends_on:
      postgres:
        condition: "service_started"
    networks:
      - "aspire"
  webfrontend:
    image: "${WEBFRONTEND_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${WEBFRONTEND_PORT}"
      ConnectionStrings__ankibridgedb: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=ankibridgedb"
      ANKIBRIDGEDB_HOST: "postgres"
      ANKIBRIDGEDB_PORT: "5432"
      ANKIBRIDGEDB_USERNAME: "postgres"
      ANKIBRIDGEDB_PASSWORD: "${POSTGRES_PASSWORD}"
      ANKIBRIDGEDB_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/ankibridgedb"
      ANKIBRIDGEDB_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/ankibridgedb"
      ANKIBRIDGEDB_DATABASENAME: "ankibridgedb"
      ConnectionStrings__blobs: "${STORAGE_OUTPUTS_BLOBENDPOINT}"
      BLOBS_URI: "${STORAGE_OUTPUTS_BLOBENDPOINT}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://compose-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "webfrontend"
    ports:
      - "${WEBFRONTEND_PORT}"
    depends_on:
      postgres:
        condition: "service_started"
      migrationservice:
        condition: "service_completed_successfully"
      azurite:
        condition: "service_started"
    networks:
      - "aspire"
networks:
  aspire:
    driver: "bridge"
volumes:
  azurite-data:
